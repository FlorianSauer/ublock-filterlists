name: Build combined filter list

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Build ublock-filterlists.txt
        run: |
          mkdir -p dist
          {
            echo "! Title: ublock-filterlists – all hosts"
            echo "! Description: Custom filter lists for uBlock Origin (all hosts in one list)"
            echo "! Homepage: https://github.com/FlorianSauer/ublock-filterlists"
            echo "! Expires: 2 days"
            echo "! Version: $(date -u +%Y%m%d%H%M%S)"
            echo "! Last modified: $(date -u +%F)"
            echo "! Licence: MIT"
            echo "!"
            cat domain-lists/heise-de.txt
            echo ""
            cat domain-lists/tumblr-com.txt
            echo ""
            cat domain-lists/discord-com.txt
          } > dist/ublock-filterlists.txt
          wc -l dist/ublock-filterlists.txt

      - name: Publish as release asset (plain text, no archive)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create latest dist/ublock-filterlists.txt \
            --title "ublock-filterlists – all hosts" \
            --notes "ublock-filterlists.txt contains every host list in one plain-text file." \
            || gh release upload latest dist/ublock-filterlists.txt --clobber

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
